{% load static %}
{% include "header.html" %}

  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1>Edit Group</h1>
          </div>
          <!-- <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a href="#">Home</a></li>
              <li class="breadcrumb-item active">Edit Group</li>
            </ol>
          </div> -->
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
             </div>
            {% endfor %}
          {% endif %}
        <div class="row">
          <!-- left column -->
          <div class="col-md-12">
            <!-- jquery validation -->
            <div class="card card-primary">
              <div class="card-header">
                <h3 class="card-title">Edit Your Group Data</h3>
              </div>
              <!-- /.card-header -->
              <!-- form start -->
              <form method="POST" action="{% url 'update_group' group_id=group_id %}">
                {% csrf_token %}
                <div class="card-body">
                  <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" name="name" class="form-control" id="name" placeholder="Enter name" value="{{ group.name }}" validate required>
                  </div>
                  <div class="form-group">
                    <label for="platform">Platform</label>
                    <select name="platform" id="platform" class="form-control" validate required>
                      <option value="">-- Select Platform --</option>
                      <option value="WhatsApp" {% if group.platform == "WhatsApp" %}selected{% endif %}>WhatsApp</option>
                      <option value="Telegram" {% if group.platform == "Telegram" %}selected{% endif %}>Telegram</option>
                      <option value="Facebook" {% if group.platform == "Facebook" %}selected{% endif %}>Facebook</option>
                      <option value="Instagram" {% if group.platform == "Instagram" %}selected{% endif %}>Instagram</option>
                      <option value="Twitter" {% if group.platform == "Twitter" %}selected{% endif %}>Twitter</option>
                      <option value="LinkedIn" {% if group.platform == "LinkedIn" %}selected{% endif %}>LinkedIn</option>
                      <option value="YouTube" {% if group.platform == "YouTube" %}selected{% endif %}>YouTube</option>
                      <option value="Snapchat" {% if group.platform == "Snapchat" %}selected{% endif %}>Snapchat</option>
                      <option value="Pinterest" {% if group.platform == "Pinterest" %}selected{% endif %}>Pinterest</option>
                      <option value="Reddit" {% if group.platform == "Reddit" %}selected{% endif %}>Reddit</option>
                      <option value="Discord" {% if group.platform == "Discord" %}selected{% endif %}>Discord</option>
                      <option value="Slack" {% if group.platform == "Slack" %}selected{% endif %}>Slack</option>
                      <option value="WeChat" {% if group.platform == "WeChat" %}selected{% endif %}>WeChat</option>
                      <option value="Line" {% if group.platform == "Line" %}selected{% endif %}>Line</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label for="group_type">Group type</label>
                    <select name="group_type" id="group_type" class="form-control" validate required>
                      <option value="">-- Select Group Type --</option>
                      <option value="Group" {% if group.group_type == "Group" %}selected{% endif %}>Group</option>
                      <option value="Channel" {% if group.group_type == "Channel" %}selected{% endif %}>Channel</option>
                      <option value="Broadcast" {% if group.group_type == "Broadcast" %}selected{% endif %}>Broadcast</option>
                    </select>
                  </div>
                </div>
                <div class="card-footer">
                  <button type="submit" class="btn btn-primary">Submit</button>
                </div>
              </form>

            </div>
            <!-- /.card -->
            </div>
          <!--/.col (left) -->
          <!-- right column -->
          <div class="col-md-6">

          </div>
          <!--/.col (right) -->
        </div>
        <!-- /.row -->
      </div><!-- /.container-fluid -->
    </section>
    <!-- /.content -->
  </div>
  <!-- /.content-wrapper -->
  <footer class="main-footer">
    <!-- <div class="float-right d-none d-sm-block">
      <b>Version</b> 3.2.0-rc
    </div>
    <strong>Copyright &copy; 2014-2021 <a href="https://adminlte.io">AdminLTE.io</a>.</strong> All rights reserved. -->
  </footer>

  <!-- Control Sidebar -->
  <aside class="control-sidebar control-sidebar-dark">
    <!-- Control sidebar content goes here -->
  </aside>
  <!-- /.control-sidebar -->
</div>
<!-- ./wrapper -->

<!-- jQuery -->
<script src="../../static/plugins/jquery/jquery.min.js"></script>
<!-- Bootstrap 4 -->
<script src="../../static/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<!-- jquery-validation -->
<script src="../../static/plugins/jquery-validation/jquery.validate.min.js"></script>
<script src="../../static/plugins/jquery-validation/additional-methods.min.js"></script>
<!-- AdminLTE App -->
<script src="../../static/dist/js/adminlte.min.js"></script>
<!-- AdminLTE for demo purposes -->
<script src="../../static/dist/js/demo.js"></script>
<!-- Page specific script -->
<script>
$(function () {
  $.validator.setDefaults({
    submitHandler: function () {
      alert( "Form successful submitted!" );
    }
  });
  $('#quickForm').validate({
    rules: {
      email: {
        required: true,
        email: true,
      },
      password: {
        required: true,
        minlength: 5
      },
      terms: {
        required: true
      },
    },
    messages: {
      email: {
        required: "Please enter a email address",
        email: "Please enter a valid email address"
      },
      password: {
        required: "Please provide a password",
        minlength: "Your password must be at least 5 characters long"
      },
      terms: "Please accept our terms"
    },
    errorElement: 'span',
    errorPlacement: function (error, element) {
      error.addClass('invalid-feedback');
      element.closest('.form-group').append(error);
    },
    highlight: function (element, errorClass, validClass) {
      $(element).addClass('is-invalid');
    },
    unhighlight: function (element, errorClass, validClass) {
      $(element).removeClass('is-invalid');
    }
  });
});
</script>
</body>
</html>
